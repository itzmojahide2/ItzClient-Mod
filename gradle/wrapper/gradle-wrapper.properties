# This file tells the gradlew script which version of Gradle to download and use.

# Where to download Gradle from. This is the official URL.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip

# The base directory to store Gradle distributions.
distributionBase=GRADLE_USER_HOME

# The path within the base directory to store the distribution.
distributionPath=wrapper/dists

# The base directory for the unzipped Gradle files.
zipStoreBase=GRADLE_USER_HOME

# The path within the base directory to store the unzipped files.
zipStorePath=wrapper/dists

# A security feature to ensure the downloaded file is from the official source.
validateDistributionUrl=true