# The name of your automated build process, which appears in the Actions tab
name: Build ItzClient

# This section defines when the build should automatically run.
# 'push': Runs every time you commit and push new code.
# 'workflow_dispatch': Adds a manual "Run workflow" button on the Actions page.
on: [push, workflow_dispatch]

jobs:
  # We define a single job named 'build'.
  build:
    # This tells GitHub to use a standard, free Linux server for the build.
    runs-on: ubuntu-latest

    # This is the list of steps the server will execute in order.
    steps:
      # Step 1: Download your repository's code onto the build server.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install the Java Development Kit (JDK) version 21, which is required by your project.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Step 3: Make the Gradle Wrapper script executable. This is a necessary step on Linux.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Step 4: Run the main build command. This compiles all the code and creates the .jar file.
      - name: Build with Gradle
        run: ./gradlew build

      # Step 5: Upload the finished .jar file as an "artifact" so you can download it from the Actions page.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # This will be the name of the downloadable .zip file.
          name: ItzClient-Build
          # This is the path where the finished .jar files are located.
          path: '**/build/libs/*.jar'
